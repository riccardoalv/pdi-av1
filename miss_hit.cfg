# Configuracao do MISS_HIT (https://misshit.org)
#   mh_style  -> estilo/formatter (use --fix para corrigir)
#   mh_lint   -> analise estatica
#   mh_metric -> metricas de complexidade
project_root
octave: true

line_length: 100
tab_width: 4

# Funcoes e variaveis em snake_case (portugues, sem acentos)
regex_function_name: "[a-z][a-z0-9_]*"
regex_script_name: "[a-z][a-z0-9_]*"
regex_parameter_name: "[a-z][a-z0-9_]*"
regex_nested_name: "[a-z][a-z0-9_]*"

copyright_entity: "UNIR"
suppress_rule: "copyright_notice"

# Limites de complexidade (mantem o codigo facil de explicar na arguicao)
metric "cnest": limit 4
metric "cyc": limit 15

